# recon-agent 默认配置（HARD：所有阈值集中在 utils/config.py，此处仅模型与运行覆盖项）
CONTEXT_BUDGET: 100000         # 当前请求上下文容量，不是累计 token 预算
COMPACT_TRIGGER_RATIO: 0.70   # 达到约 70000 tokens 自动压缩
model:
  # 主模型可用 RECON_MODEL / RECON_API_BASE / RECON_API_KEY 覆盖；非空生效，不影响 fallback。
  provider: litellm
  name: gpt-4o-mini
  api_base: https://api.openai.com/v1  # API 根地址，不要填完整 /chat/completions 路径
  api_key: ""                       # 可填写自己的 Key；非空时优先于 api_key_env
  api_key_env: OPENAI_API_KEY        # api_key 为空时从此环境变量读取
  temperature: 0          # HARD: 结构化任务确定性
  max_retries: 2
  timeout: 120
  fallback:
    - claude-3-5-sonnet
    - deepseek-chat
  custom_endpoints:
    - name: deepseek
      base_url: https://api.deepseek.com/v1
      api_key_env: DEEPSEEK_API_KEY
      model: deepseek-chat
    - name: qwen
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api_key_env: DASHSCOPE_API_KEY
      model: qwen-plus
    - name: ollama-local
      base_url: http://localhost:11434/v1
      api_key_env: OLLAMA_API_KEY
      model: qwen2.5:32b
