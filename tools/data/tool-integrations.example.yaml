# 全部示例默认关闭。复制后填写本机路径，再启用需要的连接器。
custom_tools:
  - name: curl_headers
    kind: command
    description: 使用本机 curl 读取授权目标 HTTPS 响应头
    enabled: false
    command: [curl, --head, --max-time, '10', 'https://{target}']
    timeout_seconds: 15
    max_output_bytes: 50000
    response_format: text
    deferred: true

  - name: summarize_input
    kind: script
    description: 离线演示脚本输入与 JSON 结构化输出
    enabled: false
    script: |
      import json
      print(json.dumps(RECON_INPUT, ensure_ascii=False))
    response_format: json

  - name: api_metadata
    kind: http
    description: 读取授权目标公开 JSON 元数据
    enabled: false
    url: 'https://{target}/api/{resource}'
    method: GET
    input_schema:
      type: object
      properties:
        resource: {type: string, enum: [version, status]}
      required: [resource]
      additionalProperties: false
    # Authorization 请求头从环境读取，变量值不写在 YAML 中。
    # headers_env: {Authorization: RECON_TARGET_AUTHORIZATION}
    response_format: json

  - name: manual_headers
    kind: shell
    description: 提供人工执行的响应头命令提示
    enabled: false
    command: [curl, --head, 'https://{target}']

mcp_servers:
  - name: browser
    enabled: false
    transport: stdio
    command: node
    args: ['C:/replace/with/node_modules/@playwright/mcp/cli.js', --headless, --isolated]
    timeout_seconds: 30
    max_output_bytes: 200000
    allowed_tools: [browser_navigate, browser_snapshot, browser_network_requests, browser_close]
    target_fields:
      browser_navigate: [url]
      browser_snapshot: []
      browser_network_requests: []
      browser_close: []
    deferred: true

# HTTP 服务示例（需自行准备服务器）：
# - name: local_mcp
#   enabled: true
#   transport: http  # 传统 SSE 服务改为 sse 并填写 SSE 入口
