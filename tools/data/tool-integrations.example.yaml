#   headers_env: {Authorization: RECON_MCP_AUTHORIZATION}
#   allowed_tools: [inspect]
#   target_fields: {inspect: [url]}

API_RECON_MAX_REQUESTS: 8
API_RECON_MAX_ASSET_BYTES: 100000
API_RECON_TIMEOUT_SECONDS: 30
# TOOL_EVIDENCE_DIR: 'D:/recon-evidence'

# 原生扩展工具适配。全部外部能力默认关闭；离线记录/知识内置可用。
extension_tools:
  scanners:
    - {kind: subfinder, enabled: false, executable: subfinder, timeout_seconds: 60}
    - {kind: katana, enabled: false, executable: katana, timeout_seconds: 60}
    - {kind: ffuf, enabled: false, executable: ffuf, timeout_seconds: 60}
    - {kind: naabu, enabled: false, executable: naabu, timeout_seconds: 60}
    - kind: nuclei
      enabled: false
      executable: nuclei
      timeout_seconds: 60
      templates: [tools/data/nuclei-readonly-status.yaml]
  search:
    enabled: false
    provider: exa
    api_key_env: EXA_API_KEY
  caido:
    enabled: false
    url: http://127.0.0.1:48080
    token_env: CAIDO_TOKEN
