name: CI

on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]   # HARD: 双平台矩阵（开发文档 §14）
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install -e ".[dev]"
          pip install litellm
      - name: Check duplicate definitions
        run: ruff check .
      - name: Run Python tests
        env:
          PYTHONIOENCODING: utf-8
        run: pytest tests -q
      - name: Install TUI dependencies
        run: npm ci --ignore-scripts --prefix cli/tui
      - name: Run TUI tests
        run: npm --prefix cli/tui test
